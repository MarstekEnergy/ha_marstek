set_mode:
  name: Set operating mode
  description: Switch a Marstek device to a new operating mode.
  target:
    entity:
      integration: marstek
  fields:
    mode:
      name: Mode
      description: "Operating mode (auto, ups)."
      required: true
      selector:
        select:
          options:
            - "auto"
            - "ups"
    config:
      name: Configuration
      description: >-
        Mode-specific configuration. For ups mode pass enable.
      required: false
      selector:
        object:

set_dod:
  name: Set discharge depth
  description: Set the discharge depth (DOD), 30-88 %.
  target:
    entity:
      integration: marstek
  fields:
    value:
      name: Discharge depth
      description: Discharge depth percentage (30-88).
      required: true
      selector:
        number:
          min: 30
          max: 88
          step: 1
          unit_of_measurement: "%"

set_power_version:
  name: Set power version
  description: Set the charge and discharge power version, in watts.
  target:
    entity:
      integration: marstek
  fields:
    power_version:
      name: Power version
      description: "One of 800, 1200, 1500, 2200, 2500 watts."
      required: true
      selector:
        select:
          options:
            - "800"
            - "1200"
            - "1500"
            - "2200"
            - "2500"
