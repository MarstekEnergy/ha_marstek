name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Re-run regularly so upstream rule changes are caught without a push.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Validates custom_components/marstek with Home Assistant's own
      # validation, including the manifest rules for custom integrations.
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest
