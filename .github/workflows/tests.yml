name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install codespell
        run: python -m pip install codespell
      - name: Spell check
        run: codespell custom_components tests README.md

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant 2026.10 (the version hacs.json declares as minimum)
        # requires Python 3.14.2, and pytest-homeassistant-custom-component is
        # pinned to the release that ships HA 2026.10.1. Leaving it unpinned
        # silently resolves to the newest plugin that supports the runner
        # interpreter -- at HA 2026.2.3 on Python 3.13 -- so the suite would
        # test a release the integration does not support.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4.1.7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiomarstek==0.2.2 voluptuous pyyaml pytest pytest-asyncio pytest-homeassistant-custom-component==0.13.372 mypy pytest-cov
      - name: Run tests
        run: python -m pytest --cov=custom_components/marstek --cov-report=term-missing
      - name: Type check
        run: python -m mypy
